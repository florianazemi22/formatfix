<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormatFix – PDF side by side</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --accent:#2563eb; --border:#d5d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --text:#eceef2; --muted:#9aa1ad; --accent:#5b8def; --border:#363b45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; padding:24px 16px; }
  main { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  #drop { display:block; border:2px dashed var(--border); border-radius:10px; padding:32px 16px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  #drop input { display:none; }
  label.opt { display:flex; gap:8px; align-items:center; margin-top:14px; color:var(--muted); font-size:.95rem; }
  button { margin-top:18px; width:100%; padding:12px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { margin-top:14px; min-height:1.5em; color:var(--muted); }
  #status.err { color:#dc2626; }
  button#dl { background:#16a34a; }
  select { margin-left:auto; padding:6px 8px; font-size:.95rem; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); }
  a#open { display:none; margin-top:10px; text-align:center; color:var(--accent); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>PDF side by side</h1>
  <p class="sub">Upload a PDF. Each page is copied twice, side by side, as B6 (128×182 mm) on an A4 landscape sheet.</p>

  <label id="drop">
    <input type="file" id="file" accept="application/pdf,.pdf">
    <span id="fname">Click or drop a PDF here</span>
  </label>

  <label class="opt"><input type="checkbox" id="guides" checked> Draw thin cut guides around each B6 copy</label>

  <label class="opt">Save as
    <select id="fmt">
      <option value="pdf">PDF</option>
      <option value="jpg">JPEG (maximum quality)</option>
    </select>
  </label>
  <label class="opt" id="dpiRow" style="display:none">Resolution
    <select id="dpi">
      <option value="300" selected>300 DPI – print quality</option>
      <option value="200">200 DPI</option>
      <option value="150">150 DPI – smaller file</option>
    </select>
  </label>

  <button id="go" disabled>Convert</button>
  <div id="status"></div>
  <button id="dl" disabled>Download</button>
  <a id="open" target="_blank" rel="noopener">Or open it in a new tab</a>
</main>

<script src="pdf-lib.min.js"></script>
<script src="pdf.min.js"></script>
<script src="jszip.min.js"></script>
<script>
(() => {
  const { PDFDocument, rgb } = PDFLib;
  const MM = 72 / 25.4;
  const A4_W = 297 * MM, A4_H = 210 * MM;     // A4 landscape
  const B6_W = 128 * MM, B6_H = 182 * MM;     // B6 portrait

  const $ = id => document.getElementById(id);
  const fileEl = $('file'), goEl = $('go'), statusEl = $('status'), dlEl = $('dl'), openEl = $('open'), dropEl = $('drop');
  let file = null, url = null, blob = null, outName = 'output.pdf';
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  $('fmt').onchange = () => { $('dpiRow').style.display = $('fmt').value === 'jpg' ? 'flex' : 'none'; };

  function setFile(f) {
    if (!f) return;
    file = f;
    $('fname').textContent = f.name;
    goEl.disabled = false;
    dlEl.disabled = true; openEl.style.display = 'none';
    status('');
  }
  function status(msg, err) { statusEl.textContent = msg; statusEl.className = err ? 'err' : ''; }

  fileEl.onchange = () => setFile(fileEl.files[0]);
  dropEl.ondragover = e => { e.preventDefault(); dropEl.classList.add('over'); };
  dropEl.ondragleave = () => dropEl.classList.remove('over');
  dropEl.ondrop = e => { e.preventDefault(); dropEl.classList.remove('over'); setFile(e.dataTransfer.files[0]); };

  async function convert(bytes, guides) {
    const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
    const out = await PDFDocument.create();
    const pages = await out.embedPdf(src, src.getPageIndices());
    const x0 = (A4_W - 2 * B6_W) / 2;
    const y0 = (A4_H - B6_H) / 2;

    for (const emb of pages) {
      const sheet = out.addPage([A4_W, A4_H]);
      // fit the source page inside a B6 cell, keeping aspect ratio, centred
      const s = Math.min(B6_W / emb.width, B6_H / emb.height);
      const w = emb.width * s, h = emb.height * s;
      for (let i = 0; i < 2; i++) {
        const cx = x0 + i * B6_W;
        sheet.drawPage(emb, { x: cx + (B6_W - w) / 2, y: y0 + (B6_H - h) / 2, width: w, height: h });
        if (guides) sheet.drawRectangle({ x: cx, y: y0, width: B6_W, height: B6_H,
          borderColor: rgb(0.6, 0.6, 0.6), borderWidth: 0.25 });
      }
    }
    return out.save();
  }

  // Render every page of the finished PDF to a JPEG at the chosen DPI (quality 1.0, white background)
  async function toJpegs(pdfBytes, dpi) {
    const doc = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
    const out = [];
    for (let n = 1; n <= doc.numPages; n++) {
      status(`Rendering page ${n} of ${doc.numPages}…`);
      const page = await doc.getPage(n);
      const vp = page.getViewport({ scale: dpi / 72 });
      const c = document.createElement('canvas');
      c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 1.0));
      out.push(await withDpi(b, dpi));
      c.width = c.height = 0;   // free memory
    }
    return out;
  }
  // Write the DPI into the JPEG header so print software knows the physical size
  async function withDpi(b, dpi) {
    const buf = new Uint8Array(await b.arrayBuffer());
    if (buf[2] === 0xFF && buf[3] === 0xE0 && buf[6] === 0x4A && buf[7] === 0x46) { // JFIF
      buf[13] = 1; buf[14] = dpi >> 8; buf[15] = dpi & 255; buf[16] = dpi >> 8; buf[17] = dpi & 255;
    }
    return new Blob([buf], { type: 'image/jpeg' });
  }

  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  async function save(auto) {
    if (!blob) return;
    // Phones/tablets: the share sheet offers "Save to Files / Downloads"
    if (isMobile && navigator.canShare) {
      try {
        const f = new File([blob], outName, { type: blob.type });
        if (navigator.canShare({ files: [f] })) {
          await navigator.share({ files: [f] });   // files only: a title/text makes some apps save an extra .txt
          return;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;   // user closed the share sheet
        if (auto) { status('Done. Press "Download" to save it.'); return; }  // share needs a tap
      }
    }
    // Desktop / fallback: classic download
    const a = document.createElement('a');
    a.href = url; a.download = outName;
    document.body.appendChild(a); a.click(); a.remove();
    status('Downloaded. If nothing was saved, press "Download" again or use "Or open it in a new tab".');
  }
  dlEl.onclick = () => save(false);

  goEl.onclick = async () => {
    goEl.disabled = true; dlEl.disabled = true; openEl.style.display = 'none'; status('Converting…');
    try {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const result = await convert(bytes, $('guides').checked);
      const base = file.name.replace(/\.pdf$/i, '') + '_B6_side-by-side';
      if (url) URL.revokeObjectURL(url);
      if ($('fmt').value === 'jpg') {
        const jpgs = await toJpegs(result, +$('dpi').value);
        if (jpgs.length === 1) { blob = jpgs[0]; outName = base + '.jpg'; }
        else {
          const zip = new JSZip();
          jpgs.forEach((j, i) => zip.file(`${base}_page${i + 1}.jpg`, j));
          blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
          outName = base + '.zip';
        }
      } else {
        blob = new Blob([result], { type: 'application/pdf' });
        outName = base + '.pdf';
      }
      url = URL.createObjectURL(blob);
      openEl.href = url; openEl.style.display = 'block';
      dlEl.disabled = false;
      status('Done.');
      save(true);   // start the download automatically
    } catch (e) {
      console.error(e);
      status('Could not process this PDF: ' + e.message, true);
    }
    goEl.disabled = false;
  };
})();
</script>
</body>
</html>
